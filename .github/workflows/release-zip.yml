name: Release ZIP

on:
  release:
    types: [published, edited, released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: t
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -z "$TAG" ]; then echo "No tag found"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create ZIP
        run: |
          NAME="${{ github.event.repository.name }}"
          mkdir -p /tmp/pack/"$NAME"
          rsync -a --exclude '.git' --exclude '.github' ./ /tmp/pack/"$NAME"/
          cd /tmp/pack && zip -r "$GITHUB_WORKSPACE/$NAME.zip" "$NAME"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.t.outputs.tag }}" "${{ github.event.repository.name }}.zip" --clobber
